name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Odin app clean-room
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Odin
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw dependencies.json | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'odin.zip'
          Invoke-WebRequest -Uri $manifest.odin.url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.odin.sha256) {
            throw "Odin archive SHA-256 $hash, expected $($manifest.odin.sha256)"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'odin'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $odin = Get-ChildItem -Path $dest -Recurse -Filter odin.exe | Select-Object -First 1
          if (-not $odin) { throw 'odin.exe not found in the pinned archive' }
          "ODIN=$($odin.FullName)" >> $env:GITHUB_ENV
          Split-Path -Parent $odin.FullName >> $env:GITHUB_PATH

      - name: Build app
        shell: pwsh
        run: .\scripts\build-ci.ps1

      - name: Verify a second clean build
        shell: pwsh
        run: |
          $first = (Get-FileHash -Algorithm SHA256 bin\hex.exe).Hash.ToLowerInvariant()
          Remove-Item -Recurse -Force bin
          .\scripts\build-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $second = (Get-FileHash -Algorithm SHA256 bin\hex.exe).Hash.ToLowerInvariant()
          if ($first -ne $second) {
            throw "clean rebuild mismatch: first=$first second=$second"
          }
          "Reproducible hex.exe SHA-256: $second" >> $env:GITHUB_STEP_SUMMARY

      - name: Run version
        shell: pwsh
        run: .\bin\hex.exe version

      - name: Hash app
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin\hex.exe).Hash.ToLowerInvariant()
          "hex.exe SHA-256: $hash"
          "HEX_EXE_SHA256=$hash" >> $env:GITHUB_ENV
          "hex.exe SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          Set-Content -Path bin\hex.exe.sha256 -Value "$hash  hex.exe"

      - name: Assert clean tracked tree and local-only build.ps1
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            $status
            throw 'build dirtied the tracked tree'
          }

          git check-ignore -v build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 is not ignored' }
          if (git ls-files build.ps1) { throw 'build.ps1 must not be tracked' }

          $tracked = git ls-tree -r --name-only HEAD
          $forbidden = $tracked | Select-String -Pattern '^(bin/|\.sandbox/|\.upstream-ggml/|toolchains/)'
          if ($forbidden) {
            $forbidden
            throw 'generated or local-only trees are tracked'
          }
          foreach ($required in @('Hex.png', 'assets/hex.res', 'scripts/build-ci.ps1', '.github/workflows/build.yml')) {
            if (-not ($tracked -contains $required)) {
              throw "required tracked file is missing: $required"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hex-exe
          path: |
            bin/hex.exe
            bin/hex.exe.sha256
