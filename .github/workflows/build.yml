name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_shim:
        description: Also build the optional native transcribe shim
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app:
    name: Odin app clean-room
    runs-on: windows-latest
    env:
      HEX_MICROARCH: x86-64
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Odin
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw dependencies.json | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'odin.zip'
          Invoke-WebRequest -Uri $manifest.odin.url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.odin.sha256) {
            throw "Odin archive SHA-256 $hash, expected $($manifest.odin.sha256)"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'odin'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $odin = Get-ChildItem -Path $dest -Recurse -Filter odin.exe | Select-Object -First 1
          if (-not $odin) { throw 'odin.exe not found in the pinned archive' }
          "ODIN=$($odin.FullName)" >> $env:GITHUB_ENV
          Split-Path -Parent $odin.FullName >> $env:GITHUB_PATH

      - name: Build app
        run: .\build.ps1 -Release

      - name: Run version
        run: .\bin\hex.exe version

      - name: Hash app
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin\hex.exe).Hash.ToLowerInvariant()
          "hex.exe SHA-256: $hash"
          "HEX_EXE_SHA256=$hash" >> $env:GITHUB_ENV
          Set-Content -Path bin\hex.exe.sha256 -Value "$hash  hex.exe"

      - name: Assert no tracked output
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            $status
            throw 'build dirtied the tracked tree'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hex-exe
          path: |
            bin/hex.exe
            bin/hex.exe.sha256

  native-shim:
    name: Optional native shim clean-room
    if: github.event_name == 'workflow_dispatch' && inputs.native_shim
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned transcribe.cpp shim
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw dependencies.json | ConvertFrom-Json
          $rev = $manifest.transcribe_cpp.revision
          cmake -S native -B native/build `
            -DHEX_FETCH_TRANSCRIBE=ON `
            -DTRANSCRIBE_REV=$rev `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: transcribe-shim
          path: native/bin/transcribe_shim.dll
